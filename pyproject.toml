[project]
name = "european-oncology-collaboration"
version = "0.1.0"
description = "Synthetic European oncology collaboration demonstrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "azure-identity>=1.19,<2",
  "azure-monitor-opentelemetry>=1.6,<2",
  "azure-storage-blob>=12.24,<13",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "mypy>=1.15,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["collab"]
mypy_path = "src"

[tool.coverage.run]
source = ["collab"]
